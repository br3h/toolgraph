version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
    open-pull-requests-limit: 10
    versioning-strategy: 'increase'
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # Batch low-risk updates so the PR queue stays readable, but keep the
      # security-relevant packages on their own so each is reviewed in isolation.
      dev-tooling:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier*'
          - 'vitest'
          - '@vitest/*'
          - 'husky'
          - 'lint-staged'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
    ignore:
      # Pinned deliberately; the MCP SDK moves fast and each bump is reviewed by hand.
      - dependency-name: '@modelcontextprotocol/sdk'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
    labels: ['dependencies', 'ci']
    commit-message:
      prefix: 'chore(ci)'
