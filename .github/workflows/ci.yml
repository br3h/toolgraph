name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI runs with ZERO live secrets, by design. Everything below is either a
  # placeholder or a value the local Supabase stack prints at runtime, so this
  # pipeline passes identically on a fork PR with no repository secrets at all.
  NODE_VERSION: '22.22.2'
  PNPM_VERSION: '10.34.5'
  NEXT_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  # ---------------------------------------------------------------------------
  lint-typecheck-test:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The Python codegen tests compile what they generate, and validate it
      # against pydantic when it is importable. Installing it here means that
      # check actually runs in CI instead of silently skipping.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pydantic for the codegen tests
        run: python -m pip install --quiet 'pydantic>=2'

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks needs the history to scan commits, not just the tree.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history and working tree
        run: |
          gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1
          gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Assert no env file is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::A .env file is tracked by git."
            exit 1
          fi
          echo "No tracked env files other than .env.example."

  # ---------------------------------------------------------------------------
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails the build on any high or critical advisory. Runtime dependencies
      # only — a dev-only advisory does not ship to users and should not block a
      # PR, but it still shows up in the report below.
      - name: Audit production dependencies (high and critical block the build)
        run: pnpm audit --audit-level high --prod

      - name: Report dev dependency advisories (non-blocking)
        continue-on-error: true
        run: pnpm audit --audit-level high --dev

  # ---------------------------------------------------------------------------
  database-rls:
    name: Migrations and RLS isolation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase stack
        run: supabase start --exclude studio,realtime,storage-api,imgproxy,inbucket,logflare,vector

      - name: Apply migrations from scratch
        run: supabase db reset --no-seed

      - name: Export local stack credentials
        # These are the CLI's fixed local development keys. They are printed by
        # the tool, are identical on every machine, and grant access to nothing
        # but this ephemeral container. They are read at runtime rather than
        # committed so no JWT-shaped string lives in the repo.
        run: |
          supabase status -o env | sed 's/^/SUPABASE_/' >> "$GITHUB_ENV"
          echo "SUPABASE_LOCAL_READY=true" >> "$GITHUB_ENV"

      - name: RLS isolation tests
        run: pnpm test:rls

      - name: Stop stack
        if: always()
        run: supabase stop --no-backup || true

  # ---------------------------------------------------------------------------
  build:
    name: Build both apps
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        # Placeholder values only. The build must never require a live key — if
        # this step starts failing without one, that is the bug, not the CI.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_CI_PLACEHOLDER
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_ENGINE_URL: http://localhost:8787
          # Deliberately unset: SENTRY_AUTH_TOKEN, SUPABASE_SECRET_KEY,
          # RESEND_API_KEY, UPSTASH_REDIS_REST_TOKEN.
        run: pnpm build

      - name: Assert no server-only secret reached a client bundle
        # CI has no real values to grep for, so this checks the two things it
        # can prove without them: that no server-only variable name was inlined
        # into a browser chunk, and that no credential-shaped literal appears
        # there. The grep-for-actual-values check runs at deploy time.
        run: node scripts/check-client-bundle.mjs

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            apps/web/.next/build-manifest.json
            apps/engine/dist
          retention-days: 3

  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start local Supabase stack
        run: supabase start --exclude studio,realtime,storage-api,imgproxy,logflare,vector

      - name: Apply migrations
        run: supabase db reset --no-seed

      - name: Export local stack credentials into the app environment
        run: |
          API_URL="$(supabase status -o json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);process.stdout.write(j.API_URL||"http://127.0.0.1:54321")})')"
          ANON="$(supabase status -o json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);process.stdout.write(j.ANON_KEY||"")})')"
          SERVICE="$(supabase status -o json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);process.stdout.write(j.SERVICE_ROLE_KEY||"")})')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON"
            echo "SUPABASE_SECRET_KEY=$SERVICE"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"
            echo "NEXT_PUBLIC_ENGINE_URL=http://127.0.0.1:8787"
            echo "ENGINE_ALLOWED_ORIGINS=http://127.0.0.1:3000,http://localhost:3000"
            echo "PORT=8787"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$SERVICE"

      # Built here, with the local stack's values baked in, so Playwright
      # exercises the same production output that gets deployed.
      - name: Build both apps
        run: pnpm build

      - name: Run smoke test
        run: pnpm test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop stack
        if: always()
        run: supabase stop --no-backup || true

  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lint-typecheck-test, secret-scan, dependency-audit, database-rls, build, e2e]
    if: always()
    steps:
      - name: Fail if any required job did not succeed
        run: |
          echo '${{ toJSON(needs) }}' | node -e '
            let d = ""; process.stdin.on("data", c => d += c).on("end", () => {
              const needs = JSON.parse(d);
              const failed = Object.entries(needs).filter(([, v]) => v.result !== "success");
              if (failed.length) {
                for (const [name, v] of failed) console.error(`FAILED: ${name} -> ${v.result}`);
                process.exit(1);
              }
              console.log("All required jobs succeeded.");
            });
          '
